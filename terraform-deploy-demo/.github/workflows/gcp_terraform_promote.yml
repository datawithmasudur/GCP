name: GCP Terraform Promote Pipeline

on:
  workflow_dispatch:
    inputs:

      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - qa
          - uat
          - prod

      tag:
        description: 'Tag to promote (leave empty to use latest from previous env)'
        required: false
        default: ''

env:
  TF_VERSION: "1.14.8"
  WORKING_DIR: "./terraform"

jobs:

  # resolve which tag to deploy:
  # - if tag input is empty → pick latest tag from previous environment
  # - if tag input is provided → use that exact tag
  resolve-tag:
    name: Resolve Tag
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Tag
        id: resolve
        run: |
          git fetch --tags

          # each environment promotes from the previous one
          if [ "${{ inputs.environment }}" == "qa" ]; then
            SOURCE_PREFIX="dev-"
          elif [ "${{ inputs.environment }}" == "uat" ]; then
            SOURCE_PREFIX="qa-"
          elif [ "${{ inputs.environment }}" == "prod" ]; then
            SOURCE_PREFIX="uat-"
          fi

          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            echo "Using specified tag: $TAG"
          else
            # sort numerically by the sequence number after the prefix
            TAG=$(git tag --list "${SOURCE_PREFIX}*" \
              | sort -t'-' -k2 -n \
              | tail -n 1)
            echo "Using latest tag: $TAG"
          fi

          if [ -z "$TAG" ]; then
            echo "No tag found with prefix: $SOURCE_PREFIX"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve-tag
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout at Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: |
          terraform init \
            -backend-config=backend/${{ inputs.environment }}.hcl

      - name: Format Check
        run: terraform fmt -check

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan \
            -var-file="envs/${{ inputs.environment }}.tfvars" \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 1

  # pipeline pauses here until a reviewer approves in GitHub UI
  # configure reviewers in: Settings → Environments → Required reviewers
  approve:
    name: Waiting for Approval (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: plan
    environment: ${{ inputs.environment }}

    steps:
      - name: Approved
        run: echo "Approved. Deploying ${{ needs.resolve-tag.outputs.tag }} to ${{ inputs.environment }}"

  apply:
    name: Apply & Tag (${{ inputs.environment }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [resolve-tag, approve]
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout at Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: |
          terraform init \
            -backend-config=backend/${{ inputs.environment }}.hcl

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ env.WORKING_DIR }}

      - name: Apply
        run: terraform apply -auto-approve tfplan

      # extract sequence number from source tag and apply to new env
      # example: promoting dev-5 to QA → creates qa-5
      - name: Tag Environment
        run: |
          git fetch --tags

          SOURCE_TAG="${{ needs.resolve-tag.outputs.tag }}"

          # extract the sequence number (strip everything before the last dash)
          NUM="${SOURCE_TAG##*-}"
          NEW_TAG="${{ inputs.environment }}-$NUM"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG

          echo "Tagged: $NEW_TAG"